[project]
name = "jdr-team-bot"
version = "0.1.0"
description = "Discord coordination assistant for a senior engineering project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "discord.py>=2.6,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdr_bot"]

[project.scripts]
jdr-bot = "jdr_bot.__main__:main"

[dependency-groups]
dev = ["ruff>=0.12", "mypy>=1.17", "pytest>=8.4", "pytest-asyncio>=1.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]
